# Ajoute les personnages historiques (scripts/historiques-seed.json) au catalogue de Morceaux :
# photo ou portrait Wikimedia Commons (via Wikidata), auteur, licence et zones du visage (MediaPipe).
# Se lance tout seul quand la liste change sur une branche outils/morceaux-*, ou à la main
# (onglet Actions → « Morceaux : personnages historiques » → Run workflow).
# Le résultat (games/faces/morceaux/data/people.json) est enregistré sur la même branche.

name: 'Morceaux : personnages historiques'

on:
  workflow_dispatch:
  push:
    branches: ['outils/morceaux-*']
    paths: ['scripts/historiques-seed.json', '.github/workflows/morceaux-historiques.yml']

permissions:
  contents: write

concurrency:
  group: morceaux-historiques-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer MediaPipe et OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1
          pip install requests mediapipe opencv-python-headless numpy

      - name: Construire le catalogue
        run: |
          set -o pipefail
          npm run -s morceaux:historiques 2>&1 | tee build.log

      - name: Vérifier les catalogues
        run: npm test

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Morceaux : personnages historiques'
            echo '```'
            grep -E 'Terminé|Écartées|append|valides|Attention' build.log 2>/dev/null || echo 'Aucun journal.'
            echo '```'
            echo '### Personnes écartées'
            echo '```'
            cat scripts/.celeb-cache/historiques/skipped.csv 2>/dev/null || echo 'Aucune.'
            echo '```'
            echo '### Sans image sur Wikidata'
            echo '```'
            grep -B1 'pas d’image P18' build.log 2>/dev/null | grep -o '\] .*…' || echo 'Aucune.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer people.json sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/faces/morceaux/data/people.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Morceaux : personnages historiques ajoutés à people.json (workflow)"
          git push origin HEAD:${GITHUB_REF_NAME}
