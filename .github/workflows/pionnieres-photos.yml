# Cherche le portrait de chaque femme du jeu Pionnières sur Wikidata / Wikimedia Commons (image, auteur, licence)
# et l'enregistre dans games/women/data/photos.json. Aucune clé n'est nécessaire.
# Lancement : onglet Actions → « Portraits (Pionnières) » → Run workflow.
# Le résultat arrive sur la branche donnees/pionnieres-photos, à fusionner par une pull request.

name: Portraits (Pionnières)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Tout refaire (sinon seules les femmes sans portrait sont cherchées)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chercher les portraits
        run: node scripts/fetch-pionnieres-photos.mjs ${{ inputs.force && '--force' || '' }} 2>&1 | tee fetch.log

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Portraits des Pionnières'
            echo '```'
            tail -n 40 fetch.log 2>/dev/null || echo 'Aucun journal.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer sur la branche donnees/pionnieres-photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/women/data/photos.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau portrait."
            exit 0
          fi
          git checkout -b donnees/pionnieres-photos
          git commit -m "Pionnières : portraits Wikimedia Commons dans photos.json"
          git push --force origin donnees/pionnieres-photos
          echo "➡️ Branche donnees/pionnieres-photos poussée : ouvre (ou fais ouvrir) une pull request vers main." >> "$GITHUB_STEP_SUMMARY"
